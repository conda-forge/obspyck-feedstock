{% set name = "obspyck" %}
{% set version = "0.8.2" %}
{% set sha256 = "8a001a2c20d2b5fc4f75ace8ded10954cdca64489b68e67a314f04d8a9fc079b" %}
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.zip
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  entry_points:
    - obspyck = obspyck.obspyck:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - obspy >=1.1.0
    - numpy
    - scipy
    - matplotlib-base
    - pyqt 5

test:
  requires:
    - python {{ python_min }}
  imports:
    - obspyck
    - obspyck.obspyck
    - obspyck.util
    - obspyck.qt_designer
  commands:
    - obspyck -h

about:
  home: http://github.com/megies/obspyck
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file: LICENSE.txt
  summary: 'A GUI application for seismogram analysis'

  description: |
    ObsPyck is a GUI application that is intended to cover the tasks in a
    standard analysis workflow for seismic events in seismological observatory
    practice.
  dev_url: https://github.com/megies/obspyck

extra:
  recipe-maintainers:
    - megies
